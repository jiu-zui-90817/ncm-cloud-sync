# NCM Cloud Sync 配置示例
# 复制为 config.yaml 后修改。容器内路径以 /music、/data 为准。

# 要扫描的音乐目录，可以写多个。
# 相对路径会相对于本配置文件所在目录解析。
music_dirs:
  - /music
  # - /music2

# 状态库、session.json、qr.png、last_run.json 的存放目录。
data_dir: /data

# 可选：直接写 Cookie（不推荐，优先用 ncm-cloud-sync login）。
cookie: ""

# 可选：从文件读取 Cookie，文件内容可以是 Cookie 字符串、JSON 对象或单独的 MUSIC_U。
cookie_file: null

# 扫描的音频扩展名（小写，不带点）。
extensions:
  - mp3
  - flac
  - m4a
  - aac
  - ogg
  - opus
  - wav
  - wma
  - ape

# 允许上传的扩展名。网易云对 ape/wma 等格式支持有限，默认不传。
upload_extensions:
  - mp3
  - flac
  - m4a
  - aac
  - ogg
  - opus
  - wav

# 跳过的目录/文件通配符。
exclude:
  - ".*"
  - "@eaDir"
  - "#recycle"
  - "lost+found"

# 整棵跳过的目录，绝对路径，必须位于 music_dirs 内。
exclude_dirs: []
  # - /music/有声书

# daemon 轮询间隔（秒）。3600 = 每小时。
interval: 3600

# 网易云接口请求的最小间隔（秒），避免触发 405 限流；0 表示不限速。
rate_limit: 1.0

# 单次 HTTP 超时（秒）。
timeout: 30

# 网络错误 / 5xx 的重试次数。
retries: 3

# 小于该字节数的文件跳过；0 表示不限制。
min_size: 0

# 大于该字节数的文件标记失败；0 表示不限制。
max_upload_size: 0

# 自动同步开关。false 时只运行手动同步，后台调度不会自动触发。
auto_sync: true

# 本次上传成功或补建云盘条目后如何处理本地文件：none（不处理）/ delete（删除）/ move（移动）。
# 只处理本次上传/补建成功的文件；已存在、未变更或云端已存在的文件不会处理。
# 默认 none。启用 delete 或 move 时，若未显式写 check_missing，会默认关闭本地缺失校验。
post_sync_action: none

# post_sync_action=move 时必填：绝对目录，可以位于 music_dirs 内的子目录（会自动跳过扫描）；不能是音乐根目录；不存在会自动创建。
move_target: null

# 是否检查本地文件缺失。false 时概览和明细不显示本地缺失。
check_missing: true

# 上传前从网易云搜索补全缺失的标题、艺术家、专辑。只补缺失字段，不覆盖已有标签；匹配不可靠或接口失败时跳过。
metadata_fill: true

# 每日签到：true 时每天在下面配置的时间范围内随机自动签到一次（默认关闭）。
# Web 和 daemon 每 60 秒检查一次，到点才请求；同一天不会重复自动签到；手动签到不受随机时间限制。
# 签到只领取云贝，不增加云盘空间；使用非官方接口，可能有风控或活动规则风险。
daily_signin: false

# 自动签到随机窗口，格式 HH:MM；开始必须早于结束，默认 08:00–23:00。
# 修改窗口后当天会按新范围重新抽取随机时刻。
signin_window_start: "08:00"
signin_window_end: "23:00"

# 同步结果通知时机：always / failure / success / never。
notify_on: always

# 空跑（没有上传或补建文件）时也通知；失败、暂停、终止不受影响。
notify_empty: false

# 通知渠道。enabled=false 可先保存配置但不发送。
# 支持 telegram / bark / ntfy / gotify / discord / slack / dingtalk / serverchan /
# pushplus / pushover / pushdeer / webhook / smtp。
notify_channels: []
#  - type: bark
#    name: 手机
#    enabled: true
#    config:
#      url: https://api.day.app/你的key
#  - type: telegram
#    name: Telegram
#    enabled: true
#    config:
#      bot_token: 123456:ABC
#      chat_id: "123456789"
#  - type: dingtalk
#    name: 钉钉
#    enabled: true
#    config:
#      webhook_url: https://oapi.dingtalk.com/robot/send?access_token=...
#      secret: SEC...
#      at_mobiles: "13800138000"

# DEBUG / INFO / WARNING / ERROR
log_level: INFO