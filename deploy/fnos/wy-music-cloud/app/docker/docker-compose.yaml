services:
  wy-music-cloud:
    build:
      context: ./context
      dockerfile: Dockerfile
      args:
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"
    image: "wy-music-cloud:${WY_VERSION:-0.1.0}"
    container_name: wy-music-cloud
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      WY_MUSIC_DIRS: /music
      WY_MUSIC_DATA_DIR: /data
      WY_MUSIC_INTERVAL: "${WY_MUSIC_INTERVAL:-3600}"
      WY_MUSIC_DRY_RUN: "${WY_MUSIC_DRY_RUN:-false}"
      WY_MUSIC_LOG_LEVEL: "${WY_MUSIC_LOG_LEVEL:-INFO}"
    volumes:
      - "wy-music-cloud-data:/data"
      - "${WY_MUSIC_DIR:-/vol1/1000/Music}:/music:ro"
    command: ["daemon"]

volumes:
  wy-music-cloud-data:
    name: wy-music-cloud-data
