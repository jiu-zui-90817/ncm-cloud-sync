[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-cloud-sync"
version = "0.3.7"
description = "NCM Cloud Sync：网易云音乐云盘自动同步工具，带 Web 管理界面，适合飞牛 NAS / Docker 长期运行"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NCM Cloud Sync contributors" }]
keywords = ["netease", "music", "cloud", "nas", "fnos", "sync"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27,<1",
  "pycryptodome>=3.20",
  "mutagen>=1.47",
  "PyYAML>=6.0",
  "qrcode[pil]>=7.4",
  "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ncm-cloud-sync = "ncm_cloud_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"